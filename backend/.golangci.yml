version: "2"
run:
  tests: true
linters:
  enable:
    - bodyclose
    - gocritic
    - gosec
    - misspell
    - noctx
    - revive
    - sqlclosecheck
    - testifylint
  disable:
    - exhaustruct
  settings:
    gosec:
      excludes:
        - G115
    revive:
      rules:
        - name: exported
          severity: warning
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - gosec
        path: _test\.go
      # cmd entrypoints legitimately log.Fatal/os.Exit after defers --
      # process teardown handles the cleanup those defers would do.
      - linters:
          - gocritic
        path: cmd/
        text: exitAfterDefer
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/edugraph-ai/edugraph
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
