name: Security Scan

on:
  push:
    branches: [main, develop]
  schedule:
    - cron: '0 2 * * 1'  # Every Monday 02:00 UTC
  pull_request:
    branches: [main, develop]

jobs:
  trivy:
    name: Trivy — Container + FS Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '0'           # ← warn only until baseline is established
          ignore-unfixed: true
          format: table

  govulncheck:
    name: Go Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: backend/go.sum

      - name: Check if go.sum exists
        id: check
        run: |
          if [ -s backend/go.sum ]; then
            echo "has_sum=true" >> $GITHUB_OUTPUT
          else
            echo "has_sum=false" >> $GITHUB_OUTPUT
          fi

      - name: Install govulncheck
        if: steps.check.outputs.has_sum == 'true'
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        if: steps.check.outputs.has_sum == 'true'
        working-directory: backend
        run: govulncheck ./... || true   # ← warn only initially

      - name: Skip — go.sum empty
        if: steps.check.outputs.has_sum == 'false'
        run: echo "✓ go.sum not populated yet — govulncheck skipped."

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: critical   # ← only block on CRITICAL (not HIGH) initially

  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
