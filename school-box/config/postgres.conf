# School Box Postgres tuning.
#
# Budgeted against README.md's assumed 16 GB / 4-8 core hardware baseline,
# with Postgres getting roughly a 3 GB share -- Neo4j (~1.5 GB, see its
# own NEO4J_dbms_memory_heap_max__size/pagecache_size settings in
# docker-compose.yml), Redis (256 MB, --maxmemory in docker-compose.yml),
# Ollama (needs ~5-6 GB to run a 7B q4 model comfortably), and OS + the Go
# API + the Python AI service take the rest. If you're deploying on
# different real hardware, rebudget these against README.md's table
# first, don't just copy this file unchanged.
#
# Mounted into the postgres container by docker-compose.yml
# (postgres_data volume holds the actual data directory; this file is a
# separate bind mount read via `command: postgres -c config_file=...`).

# ── NETWORK ───────────────────────────────────────────────────
# The official postgres image's entrypoint normally injects
# `-c listen_addresses=*` itself so other containers can reach it -- but
# docker-compose.yml's `command: postgres -c config_file=...` (needed to
# point Postgres at this file at all) replaces that default command
# entirely, so it never happens unless set here. Without this, Postgres
# only listens on localhost *inside its own container* and every other
# service (api, sync-agent) gets connection-refused reaching it over the
# compose network -- found by actually testing this against a live
# sync-agent container, not by inspection.
listen_addresses = '*'

# ── MEMORY ────────────────────────────────────────────────────
shared_buffers = 768MB              # ~25% of Postgres's 3GB budget
effective_cache_size = 2GB          # includes OS page cache, not just shared_buffers
work_mem = 8MB                      # modest per-operation budget -- see max_connections below;
                                     # max_connections * work_mem must not blow the 3GB budget
                                     # under worst-case concurrent load
maintenance_work_mem = 128MB
wal_buffers = 16MB

# ── CONNECTIONS ───────────────────────────────────────────────
# A School Box serves one school, not a multi-tenant cloud pool -- the
# PRD's capacity target is 150 concurrent exam submissions (Section 7),
# so this has real headroom above that without needing Supabase-pooler-
# style aggressive limits (see the main .env.example's
# POSTGRES_MAX_CONNS=15 for the *cloud* side, which pools across many
# schools; this is a dedicated single-school instance).
max_connections = 80

# ── STORAGE (SSD assumption -- see README.md's hardware table) ──
random_page_cost = 1.1              # SSD, not spinning disk -- default 4.0 assumes HDD seek cost
effective_io_concurrency = 200      # SSDs handle concurrent I/O well; HDDs would want ~2

# ── CHECKPOINTS ───────────────────────────────────────────────
# Spread checkpoint I/O out rather than bursting -- a School Box has no
# ops team watching for I/O stalls during a checkpoint storm mid-exam.
checkpoint_completion_target = 0.9
max_wal_size = 1GB
min_wal_size = 80MB

# ── LOGGING ───────────────────────────────────────────────────
# Slow-query visibility without flooding local disk -- there's no
# central log aggregation on a School Box (see health-check.sh for what
# operational visibility does exist), so this is the actual record of
# what the database has been doing when someone investigates later.
log_min_duration_statement = 1000   # log queries slower than 1s
log_checkpoints = on
log_connections = off               # would be noisy: this is a low-connection-churn deployment
log_disconnections = off
log_lock_waits = on

# ── AUTOVACUUM ────────────────────────────────────────────────
# Left at defaults deliberately -- this workload (exam submissions, gap
# records, sync outbox churn) isn't extreme enough to need hand-tuning,
# and an under-tuned autovacuum is a much safer failure mode than an
# over-aggressive one competing with exam traffic for I/O.
