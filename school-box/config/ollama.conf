# School Box Ollama config.
#
# Ollama has no traditional config-file format -- everything here is an
# env var the Ollama server reads on startup, loaded into the `ollama`
# service via docker-compose.yml's `env_file:` (not a bind-mounted config
# file like postgres.conf/redis.conf).
#
# Budgeted against README.md's 16GB/4-8-core hardware baseline: qwen2.5:
# 7b-instruct-q4_K_M needs ~5-6GB resident (see postgres.conf's header
# for the full per-service memory breakdown -- Ollama is the single
# largest consumer on this box).

# Only ever keep one model resident. This box runs one model
# (OLLAMA_MODEL in .env.school-box, qwen2.5:7b-instruct-q4_K_M by
# default) -- a second concurrently-loaded model would blow the RAM
# budget, and nothing in this codebase's LLMProvider interface
# (ai-service/app/utils/llm_provider.py) ever asks Ollama to swap
# models at runtime.
OLLAMA_MAX_LOADED_MODELS=1

# One generation at a time. A School Box serves one school, not a
# multi-tenant pool (see postgres.conf's max_connections note for the
# same reasoning) -- letting Ollama fan a single loaded model out across
# parallel requests would multiply its memory use per the Ollama docs,
# which this box's RAM budget has no room for. Callers (gap analysis,
# study plan, tutor -- all via generate_with_fallback) queue instead of
# racing each other.
OLLAMA_NUM_PARALLEL=1

# Requests beyond OLLAMA_NUM_PARALLEL queue instead of erroring, up to
# this many. Generous relative to what a single school's concurrent
# gap-analysis/study-plan/tutor traffic actually looks like.
OLLAMA_MAX_QUEUE=64

# Keep the model resident for 30 minutes after its last use rather than
# Ollama's default 5 -- gap analysis, study plans, and the tutor all hit
# this same model throughout a school day, and reloading a 7B q4 model
# from disk on every request would add real latency each time demand is
# bursty (e.g. a class finishing an exam together). 30m, not "forever":
# still frees the ~5-6GB back up overnight when nothing's asking.
OLLAMA_KEEP_ALIVE=30m
