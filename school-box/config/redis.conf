# School Box Redis config.
#
# Redis here backs the five AI-service job queues (curriculum/exam/
# answer-key parsing, gap analysis, study plans -- see
# ai-service/app/db/redis.py) plus refresh-token storage. It is NOT the
# system of record for anything -- Postgres is -- so this is tuned to
# survive a power loss losing at most a few seconds of queued jobs
# (acceptable: a lost curriculum-parse job just needs re-uploading, see
# the worker docstrings' "provisional draft" philosophy) rather than
# treating Redis durability as critical.
#
# Budgeted against README.md's 16GB/4-8-core hardware baseline -- see
# postgres.conf's header for the full per-service memory breakdown.
# docker-compose.yml previously set --maxmemory inline via `command:`;
# this file supersedes that (docker-compose.yml now points redis-server
# at this file instead) so every Redis setting lives in one place
# instead of being split between compose and here.

# ── MEMORY ────────────────────────────────────────────────────
maxmemory 256mb

# allkeys-lru: queues + refresh tokens are all fine to evict LRU-first
# under memory pressure -- nothing here is irreplaceable (see the "not
# the system of record" note above).
maxmemory-policy allkeys-lru

# ── PERSISTENCE ───────────────────────────────────────────────
# RDB snapshots, not AOF -- a School Box can genuinely lose power
# without warning (no UPS assumed), and losing the last few seconds of
# queue state is an acceptable tradeoff against AOF's higher write
# overhead on modest hardware for a workload that isn't queue-critical.
save 900 1
save 300 10
save 60 10000
rdbcompression yes
rdbchecksum yes
dir /data

# ── NETWORK ───────────────────────────────────────────────────
# LAN-only by the network topology (see ../config/Caddyfile and
# docker-compose.yml -- redis is never published to the host, only
# reachable from other containers on the compose network), so this
# doesn't bind 0.0.0.0 by choice, it's already unreachable from outside
# docker's network. protected-mode stays on regardless as defense in
# depth.
protected-mode yes

# ── LIMITS ────────────────────────────────────────────────────
# Idle client timeout -- workers reconnect automatically.
timeout 300
tcp-keepalive 60
