version: "3.9"

services:

  # ─────────────────────────────
  # Core API (Go)
  # ─────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"

    volumes:
      - ./backend:/app

    env_file:
      - .env

    environment:
      APP_ENV: development

      # Postgres lives on Supabase (session pooler) -- see .env / CLAUDE.md.
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE}
      POSTGRES_MAX_CONNS: ${POSTGRES_MAX_CONNS:-15}

      # Inter-service: use Docker DNS names, NOT the localhost values from
      # .env (which are for running services directly on the host, not inside
      # the Docker network where each service name is its hostname).
      NEO4J_URI: bolt://neo4j:7687
      REDIS_URL: redis://redis:6379
      AI_SERVICE_URL: http://ai-service:8000

      # JWT keypair (auto-generated in APP_ENV=development)
      JWT_PRIVATE_KEY_PATH: ${JWT_PRIVATE_KEY_PATH:-/tmp/jwt_private.pem}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH:-/tmp/jwt_public.pem}
      JWT_ACCESS_TTL_MINUTES: ${JWT_ACCESS_TTL_MINUTES:-15}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-7}

      LOG_LEVEL: ${LOG_LEVEL:-debug}
      PORT: 8080

    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy

    restart: unless-stopped


  # ─────────────────────────────
  # AI Service (Python / FastAPI)
  # ─────────────────────────────
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"

    volumes:
      - ./ai-service:/app

    env_file:
      - .env

    environment:
      # Inter-service: Docker DNS names
      NEO4J_URI: bolt://neo4j:7687
      REDIS_URL: redis://redis:6379

      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE}

      LLM_PROVIDER: ${LLM_PROVIDER:-local}
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b-instruct-q4_K_M}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-large}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-sentence_transformers}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}

      KT_WORKER_CONCURRENCY: ${KT_WORKER_CONCURRENCY:-1}
      GAP_WORKER_CONCURRENCY: ${GAP_WORKER_CONCURRENCY:-1}

    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy

    restart: unless-stopped


  # ─────────────────────────────
  # Frontend (React / Vite dev server)
  # Open http://localhost:5173 in your browser.
  # ─────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      # Keep the image's node_modules intact — the host directory doesn't have
      # them, and on Windows the bind-mount would shadow them with an empty dir.
      - /app/node_modules

    environment:
      # The Vite dev-server proxy forwards /api/* to the Go API container.
      API_PROXY_TARGET: http://api:8080

      # Enable filesystem polling for hot-module-replacement on Windows Docker
      # Desktop (NTFS → Linux container doesn't support inotify over bind mounts).
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "500"

    depends_on:
      - api

    restart: unless-stopped


  # ─────────────────────────────
  # PostgreSQL + pgvector -- LOCAL FALLBACK ONLY (profiles: local-db).
  # Postgres normally lives on Supabase. Opt in with:
  #   docker compose --profile local-db up -d postgres flyway
  # then set POSTGRES_HOST=postgres, POSTGRES_USER=edugraph,
  # POSTGRES_SSLMODE=disable in .env.
  # ─────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    profiles: ["local-db"]

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    environment:
      POSTGRES_DB: edugraph
      POSTGRES_USER: edugraph
      POSTGRES_PASSWORD: postgres

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edugraph -d edugraph"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped


  flyway:
    image: flyway/flyway:10
    profiles: ["local-db"]

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - ./backend/db/migrations:/flyway/sql

    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/edugraph
      FLYWAY_USER: edugraph
      FLYWAY_PASSWORD: postgres
      FLYWAY_LOCATIONS: filesystem:/flyway/sql

    command: migrate
    restart: "no"


  # ─────────────────────────────
  # Neo4j Graph Database
  # Browser: http://localhost:7474  (neo4j / <NEO4J_PASSWORD from .env>)
  # ─────────────────────────────
  neo4j:
    image: neo4j:5.18-enterprise

    ports:
      - "7474:7474"
      - "7687:7687"

    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD}
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"

      NEO4J_PLUGINS: '["graph-data-science", "apoc"]'

      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 2g
      NEO4J_dbms_memory_pagecache_size: 1g

    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD} 'RETURN 1'"
        ]
      interval: 15s
      timeout: 10s
      retries: 10

    restart: unless-stopped


  # ─────────────────────────────
  # Redis
  # ─────────────────────────────
  redis:
    image: redis:7-alpine

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    command: >
      redis-server
      --appendonly no
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped


  # ─────────────────────────────
  # Ollama (local LLM)
  # Pulls models on first run -- see OLLAMA_MODEL in .env.
  # Not needed when LLM_PROVIDER=cloud (Gemini).
  # ─────────────────────────────
  ollama:
    image: ollama/ollama:latest

    ports:
      - "11434:11434"

    volumes:
      - ollama_models:/root/.ollama

    restart: unless-stopped


  # ─────────────────────────────
  # Dev tools (opt-in: --profile tools)
  # ─────────────────────────────
  redis-commander:
    image: rediscommander/redis-commander:latest
    profiles: ["tools"]

    ports:
      - "8081:8081"

    environment:
      - REDIS_HOSTS=local:redis:6379

    depends_on:
      - redis


  jaeger:
    image: jaegertracing/all-in-one:latest
    profiles: ["tools"]

    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP


  # ─────────────────────────────
  # Monitoring (opt-in: --profile monitoring)
  # Grafana: http://localhost:3000  (admin/admin)
  # ─────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    profiles: ["monitoring"]

    ports:
      - "9090:9090"

    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml


  grafana:
    image: grafana/grafana:latest
    profiles: ["monitoring"]

    ports:
      - "3000:3000"

    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin


  # ─────────────────────────────
  # School Box Sync Agent
  # Run with: docker compose --profile school-box up -d sync-agent
  # Requires: .env.school-box (see .env.school-box.example) and the
  # local-db postgres container already running and migrated.
  # ─────────────────────────────
  sync-agent:
    build:
      context: ./backend
      dockerfile: cmd/sync-agent/Dockerfile
    profiles: ["school-box"]

    env_file:
      - .env.school-box

    environment:
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-60}
      HEALTH_ADDR: ":8081"

    ports:
      - "8082:8081"

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health | grep -q status"]
      interval: 30s
      timeout: 5s
      retries: 3

    restart: unless-stopped


# ─────────────────────────────
# Named volumes
# ─────────────────────────────
volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  redis_data:
  ollama_models:
