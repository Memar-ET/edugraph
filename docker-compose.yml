version: "3.9"

services:

  # ─────────────────────────────
  # Core API (Go)
  # ─────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"

    volumes:
      - ./backend:/app

    env_file:
      - .env

    environment:
      APP_ENV: ${APP_ENV}

      # Postgres now lives on Supabase (session pooler), not the local
      # `postgres` container below -- see .env / CLAUDE.md. No depends_on
      # entry for it: it's a remote service Docker can't health-check or
      # start, and connection failures surface at request time same as any
      # other external dependency.
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE}

      NEO4J_URI: ${NEO4J_URI}
      REDIS_URL: ${REDIS_URL}
      AI_SERVICE_URL: ${AI_SERVICE_URL}

    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy

    restart: unless-stopped


  # ─────────────────────────────
  # AI Service (Python / FastAPI)
  # ─────────────────────────────
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"

    volumes:
      - ./ai-service:/app

    env_file:
      - .env

    environment:
      NEO4J_URI: ${NEO4J_URI}
      REDIS_URL: ${REDIS_URL}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      GEMINI_API_KEY: ${GEMINI_API_KEY}

    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy

    restart: unless-stopped


  # ─────────────────────────────
  # Frontend (React / Vite)
  # ─────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      - /app/node_modules

    environment:
      # Frontend code calls relative /api/v1/* paths; the Vite dev-server
      # proxy (vite.config.ts) forwards them to the Go api container. This
      # was previously (incorrectly) pointed at AI_SERVICE_URL, which would
      # have sent every backend call to the Python service instead of Go.
      API_PROXY_TARGET: http://api:8080

    restart: unless-stopped


  # ─────────────────────────────
  # PostgreSQL + pgvector -- LOCAL FALLBACK ONLY, not started by default.
  # Postgres normally lives on Supabase now (see .env). Opt in with
  # `docker compose --profile local-db up -d postgres flyway` if you need
  # to develop against a plain local Postgres instead (e.g. offline), and
  # point POSTGRES_HOST=postgres / POSTGRES_SSLMODE=disable in .env to use it.
  # ─────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    profiles: ["local-db"]

    ports:
      - "${POSTGRES_PORT}:5432"

    environment:
      POSTGRES_DB: edugraph
      POSTGRES_USER: edugraph
      POSTGRES_PASSWORD: postgres

    volumes:
      - postgres_data:/var/lib/postgresql/data


    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edugraph -d edugraph"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

  flyway:
    image: flyway/flyway:10
    profiles: ["local-db"]

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - ./backend/db/migrations:/flyway/sql

    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/edugraph
      FLYWAY_USER: edugraph
      FLYWAY_PASSWORD: postgres
      FLYWAY_LOCATIONS: filesystem:/flyway/sql

    command: migrate

    restart: "no"
  # ─────────────────────────────
  # Neo4j Graph Database
  # ─────────────────────────────
  neo4j:
    image: neo4j:5.18-enterprise

    ports:
      - "7474:7474"
      - "7687:7687"

    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"

      NEO4J_PLUGINS: '["graph-data-science", "apoc"]'

      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 2g
      NEO4J_dbms_memory_pagecache_size: 1g

    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u ${NEO4J_USER} -p ${NEO4J_PASSWORD} 'RETURN 1'"
        ]
      interval: 15s
      timeout: 10s
      retries: 10

    restart: unless-stopped


  # ─────────────────────────────
  # Redis
  # ─────────────────────────────
  redis:
    image: redis:7-alpine

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    command: >
      redis-server
      --appendonly no
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped


  # ─────────────────────────────
  # Ollama (LLM)
  # ─────────────────────────────
  ollama:
    image: ollama/ollama:latest

    ports:
      - "11434:11434"

    volumes:
      - ollama_models:/root/.ollama

    restart: unless-stopped


  # ─────────────────────────────
  # Redis Commander (dev tools)
  # ─────────────────────────────
  redis-commander:
    image: rediscommander/redis-commander:latest

    ports:
      - "8081:8081"

    environment:
      - REDIS_HOSTS=local:redis:6379

    depends_on:
      - redis

    profiles: ["tools"]


  # ─────────────────────────────
  # Jaeger (Tracing)
  # ─────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:latest

    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

    profiles: ["tools"]


  # ─────────────────────────────
  # Prometheus
  # ─────────────────────────────
  prometheus:
    image: prom/prometheus:latest

    ports:
      - "9090:9090"

    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml

    profiles: ["monitoring"]


  # ─────────────────────────────
  # Grafana
  # ─────────────────────────────
  grafana:
    image: grafana/grafana:latest

    ports:
      - "3000:3000"

    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin

    profiles: ["monitoring"]


# ─────────────────────────────
# Volumes
# ─────────────────────────────
volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  redis_data:
  ollama_models: