{{- range list "api" "ai" "frontend" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: edugraph-{{ . }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "edugraph.labels" $ | nindent 4 }}
  {{- with (index $.Values.serviceAccount . "annotations") }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
